# SecureMark — Apache virtual host example (web deployment)
#
# The web app is a purely static site: copy the CONTENTS of build/web/
# into the DocumentRoot, no server-side code is needed.
#
#   1. Build:            flutter build web --release
#   2. Copy:             rsync -av --delete build/web/ /srv/http/securemark/
#   3. Install this file (adapt the placeholders), then:
#                        apachectl configtest && systemctl reload httpd
#   4. SELinux (RHEL/Alma/CentOS only — /srv is not a default webroot,
#      without this you get 403 errors):
#                        semanage fcontext -a -t httpd_sys_content_t "/srv/http/securemark(/.*)?"
#                        restorecon -R /srv/http/securemark
#
# Placeholders to replace:
#   securemark.example.com  → your domain
#   admin@example.com       → your admin email
#   /srv/http/securemark    → your document root
#   /var/log/httpd/...      → your log paths
#
# Notes:
#   - "Protocols h2" needs mod_http2 (check: httpd -M | grep http2).
#   - HSTS is a one-way street for a year: keep it only once your
#     certificate renewals are reliable.
#   - The AddType lines matter: without application/wasm the WASM
#     build silently fails, and .mjs is missing from old mime.types.

# --- HTTP → HTTPS redirect ---
<VirtualHost *:80>
    ServerName securemark.example.com
    ServerAdmin admin@example.com
    Redirect permanent / https://securemark.example.com/
    ErrorLog /var/log/httpd/error_securemark_log
    CustomLog /var/log/httpd/access_securemark_log combined
</VirtualHost>

# --- HTTPS ---
<VirtualHost *:443>
    ServerName securemark.example.com
    ServerAdmin admin@example.com

    DocumentRoot "/srv/http/securemark"

    <Directory /srv/http/securemark>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # TLS (Let's Encrypt): fullchain.pem = leaf + intermediate.
    # SSLCertificateChainFile is deprecated since Apache 2.4.8 — do not
    # combine it with fullchain.pem (the leaf cert would be sent twice).
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/securemark.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/securemark.example.com/privkey.pem

    # MIME types required by the Flutter web build
    AddType application/wasm .wasm
    AddType application/javascript .mjs

    # Compress the big bundles (~9 MB raw → ~2.5 MB on the wire)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css \
            application/javascript application/wasm \
            application/json image/svg+xml
    </IfModule>

    # Basic security headers
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    Protocols h2 http/1.1

    ErrorLog /var/log/httpd/error_securemark_log
    CustomLog /var/log/httpd/ssl_request_securemark_log ssl_combined
</VirtualHost>
